name: raag_billing
description: A professional billing and inventory management application.
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  
  # Database (Drift)
  drift: ^2.16.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Navigation
  go_router: ^14.0.0
  
  # UI & Utilities
  google_fonts: ^6.2.1
  intl: ^0.19.0
  share_plus: ^9.0.0
  path_drawing: ^1.0.1
  
  # PDF Generation
  pdf: ^3.10.10
  printing: 5.13.1

  # Audio & Haptics
  audioplayers: ^6.0.0
  vibration: ^3.1.3

  # Image Picking
  image_picker: ^1.1.2

  # Barcode Scanning
  mobile_scanner: ^5.1.0
  permission_handler: ^11.3.1

  # Notifications
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  dio: ^5.11.1
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  # Code Generation
  build_runner: ^2.4.9
  drift_dev: ^2.16.0
  riverpod_generator: ^2.4.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/audio/beep.mp3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/Raag Billing.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/Raag Billing.png"